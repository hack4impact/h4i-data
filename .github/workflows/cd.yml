name: Backend CD

on:
  push:
    branches:
      - 52-deploy-staging-azure
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install deps
        run: npm ci --fetch-retries=5

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Verify Prisma client
        run: ls -la node_modules/.prisma/client

      - name: Build TypeScript + Prisma
        run: npm run build
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist
            node_modules
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Required for Azure login
      contents: read       # Required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_16535DB0A5374AF2A5FFD0F538170C65 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1ADF5126AE0E4076B47D70132DF2D709 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D03F78C8B0E048FAA31639496352BBFC }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'operations-api'
          slot-name: 'Production'
          package: .
