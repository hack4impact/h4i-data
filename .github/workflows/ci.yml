name: Backend CI

on:
  push:
    branches:
      - main
      - ci-cd-testing
  pull_request:
    branches:
      - main
      - ci-cd-testing
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Check connectivity to DIRECT_URL host
        run: |
          set -e
          DIRECT_HOST=$(echo "$DIRECT_URL" | sed -E 's#.*://[^@]+@([^:/?]+).*#\1#')
          echo "DIRECT_HOST=$DIRECT_HOST"
          getent hosts "$DIRECT_HOST" || true
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          pg_isready -h "$DIRECT_HOST" -p 5432 -d postgres || true
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Prisma migrate
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run tests
        run: npm test -- --runInBand
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
