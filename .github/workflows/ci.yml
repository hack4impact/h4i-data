name: Backend CI

on:
  push:
    branches:
      - main
      - sophia-ci-cd
  pull_request:
    branches:
      - main
      - sophia-ci-cd
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Debug env
        run: env | grep DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check DATABASE_URL
        run: |
          echo "DATABASE_URL is set"
          HOST=$(echo $DATABASE_URL | sed -E 's#.*://[^@]+@([^:/?]+).*#\1#')
          echo "Host extracted: $HOST"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check connectivity to pooler host
        run: |
          set -e
          DIRECT_HOST=$(echo "$DIRECT_URL" | sed -E 's#.*://[^@]+@([^:/?]+).*#\1#')
          echo "DIRECT_HOST=$DIRECT_HOST"
          getent hosts "$DIRECT_HOST" || true
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          pg_isready -h "$DIRECT_HOST" -p 5432 -d postgres || true
        env:
          DIRECT_URL: ${{ secrets.DATABASE_URL }}

      - name: Print DB host and user
        run: |
          echo "Host: $(echo $DATABASE_URL | sed -E 's#.*://[^:]+:.*@([^:/?]+).*#\1#')"
          echo "User: $(echo $DATABASE_URL | sed -E 's#.*://([^:]+):.*@.*#\1#')"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        
      - name: Prisma migrate
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}

      - name: Run tests
        run: npm test -- --runInBand
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
