name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Verify Prisma client
        run: ls -la node_modules/.prisma/client

      - name: Run ESLint
        run: pnpm exec eslint "src/**/*.ts" "tests/**/*.ts" --max-warnings=0

      - name: Run Prettier
        run: pnpm exec prettier --check "src/**/*.ts" "tests/**/*.ts"

      - name: Run tests
        run: pnpm run test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:test_password@localhost:5433/test_db
          DIRECT_URL: postgresql://postgres:test_password@localhost:5433/test_db

      - name: Stop test database
        if: always()
        run: pnpm run docker:down