name: Backend CI

on:
  push:
    branches: [ main, ci-cd-testing ]
  pull_request:
    branches: [ main, ci-cd-testing ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: johndoe
          POSTGRES_PASSWORD: testpass
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -p 5432 -U johndoe -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          DATABASE_URL=postgresql://johndoe:testpass@localhost:5432/testdb
          EOF

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U johndoe -d testdb; then
              echo "Postgres is ready"; exit 0
            fi
            echo "Waiting for Postgres ($i/30)"; sleep 2
          done
          echo "Postgres did not become ready in time"; exit 1

      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - name: Run tests
        run: npm test -- --runInBand
